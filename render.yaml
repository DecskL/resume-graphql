# Render Blueprint: веб-сервис из Dockerfile + бесплатный PostgreSQL.
# Render → New → Blueprint → выбрать этот репозиторий.
services:
  - type: web
    name: resume-graphql
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: resume-db
          property: connectionString

databases:
  - name: resume-db
    plan: free
    databaseName: resume
    user: app
